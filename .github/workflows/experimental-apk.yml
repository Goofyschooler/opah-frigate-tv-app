name: Experimental APK
on:
  workflow_dispatch:
  push:
    branches: [experiment/playback-diagnostics]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build separate diagnostic app
        env:
          OPAH_TEST_KEYSTORE_BASE64: ${{ secrets.OPAH_TEST_KEYSTORE_BASE64 }}
          OPAH_RELEASE_STORE_PASSWORD: ${{ secrets.OPAH_TEST_PASSWORD }}
          OPAH_RELEASE_KEY_PASSWORD: ${{ secrets.OPAH_TEST_PASSWORD }}
          OPAH_RELEASE_KEY_ALIAS: opah-test
        run: |
          umask 077
          export OPAH_RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/opah-test.p12"
          trap 'rm -f "$OPAH_RELEASE_KEYSTORE_FILE"' EXIT
          printf '%s' "$OPAH_TEST_KEYSTORE_BASE64" | base64 --decode > "$OPAH_RELEASE_KEYSTORE_FILE"
          bash gradlew --no-daemon -Popah.requireReleaseSigning=true testDebugUnitTest lintDebug assembleDebug
      - name: Fingerprint APK
        run: sha256sum app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: opah-test-update-bootstrap
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
