name: Experimental APK
on:
  workflow_dispatch:
  push:
    branches: [experiment/playback-diagnostics]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build separate diagnostic app
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Fingerprint APK
        run: sha256sum app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: opah-test-diagnostic-1
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
